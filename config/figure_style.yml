usage_notes:
  - "真实价格保持深灰黑，保证论文可读性。"
  - "亮绿色只用于重点高亮或缓冲机制，不大面积铺底。"
  - "悲观与风险用深蓝/天蓝并配合虚线、阈值线和文字标注区分，避免整篇图表过度红色化。"
