search_method: "seeded_random_multi_objective_plus_continuous_refinement_plus_local_stability_refinement"
objective: "composite_score"
sample_size: 36000
random_seed: 20260509
local_refinement:
  method: "scipy.optimize.differential_evolution"
  maxiter: 35
  popsize: 7
  purpose: "在随机多目标搜索后进行连续参数精修，提升短期模型分段拟合质量"
local_stability_refinement:
  method: "local_parameter_perturbation"
  sample_size: 800
  random_seed: 20260550
  purpose: "围绕连续精修结果做局部扰动复核，确认优秀参数邻域并保留综合得分更优的候选"

objective_formula: "RMSE + 0.20*abs(peak_error) + 0.25*abs(final_error) + 0.15*high_price_rmse + 0.12*early_rmse + 0.12*mid_rmse + 0.18*late_rmse + 0.18*low_price_rmse"

parameters:
  supply_interruption:
    description: "实际供应中断量"
    values: [1400, 1500, 1600, 1700, 1800]
  spr_max_release:
    description: "战略储备每日释放上限"
    values: [200, 300, 450, 600, 700]
  spr_delay_days:
    description: "战略储备启动延迟"
    values: [3, 7, 10, 14]
  route_start_day:
    description: "绕道运输开始发挥作用的日期"
    values: [7, 14, 21, 30]
  route_max_capacity:
    description: "绕道运输恢复能力上限"
    values: [150, 220, 250, 300]
  long_elasticity:
    description: "中期需求价格弹性"
    values: [-0.10, -0.14, -0.18, -0.22, -0.25]
  fear_initial:
    description: "恐慌初始强度"
    values: [0.10, 0.13, 0.16, 0.20]
  fear_decay:
    description: "恐慌情绪衰减速度"
    values: [0.04, 0.06, 0.08, 0.10, 0.12]
  inventory_daily_cap:
    description: "商业库存每日缓冲上限"
    values: [250, 350, 450, 600]
  pressure_scale:
    description: "剩余供需缺口对价格的压力系数"
    values: [0.020, 0.035, 0.045, 0.060, 0.075, 0.090]
  risk_weight:
    description: "封锁风险溢价权重"
    values: [1.60, 2.00, 2.20, 2.60, 3.00, 3.40]
  uncertainty_floor:
    description: "中期不确定性溢价平台"
    values: [0.08, 0.12, 0.16, 0.20, 0.24, 0.28]
  inventory_response:
    description: "库存对原始供需缺口的响应比例"
    values: [0.20, 0.35, 0.55, 0.75]
  adjustment_speed:
    description: "价格向目标价格调整的速度"
    values: [0.18, 0.25, 0.32, 0.40]
  buffer_relief_strength:
    description: "供需缺口被缓冲机制压住后，市场第一轮降温折价强度"
    values: [0.00, 0.04, 0.08, 0.12, 0.16]
  buffer_relief_decay_days:
    description: "缓冲确认折价的消退速度"
    values: [6, 10, 14]
  relief_discount_strength:
    description: "市场预期修复导致的阶段性折价强度"
    values: [0.00, 0.04, 0.08, 0.12, 0.16, 0.20]
  relief_start_day:
    description: "预期修复折价开始生效的日期"
    values: [30, 34, 36, 38]
  relief_peak_day:
    description: "预期修复折价达到峰值的日期"
    values: [42, 46, 50]
  relief_decay_days:
    description: "预期修复折价消退速度"
    values: [8, 12, 16, 24]

reporting:
  keep_top_n: 10
  metrics:
    - rmse
    - mae
    - peak_price_error
    - final_price_error
    - high_price_rmse
    - low_price_rmse
    - early_rmse
    - mid_rmse
    - late_rmse
